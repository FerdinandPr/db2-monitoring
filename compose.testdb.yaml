# Optionaler Test-Stack mit Db2 Community Edition.
# Start:  podman compose -f compose.yaml -f compose.testdb.yaml up -d --build
# Der erste Start dauert einige Minuten (Instanz + Datenbank werden angelegt).

services:
  db2-test:
    image: ${DB2_TEST_IMAGE:-icr.io/db2_community/db2:latest}
    container_name: db2-test
    hostname: db2-test
    privileged: true            # von der Db2 Community Edition vorausgesetzt
    restart: unless-stopped
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_TEST_PASSWORD}
      DBNAME: ${DB2_TEST_DBNAME:-TESTDB}
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      PERSISTENT_HOME: "true"
    volumes:
      - db2-test-data:/database
    ports:
      - "${DB2_TEST_PORT:-50000}:50000"

  db2-exporter:
    environment:
      EXPORTER_TARGETS_FILE: /etc/db2-exporter/targets.testdb.yaml
    depends_on:
      - db2-test

volumes:
  db2-test-data:
