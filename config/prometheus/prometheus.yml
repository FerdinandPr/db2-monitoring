global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: db2
    static_configs:
      - targets: ["db2-exporter:9953"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
